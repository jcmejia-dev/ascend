name: Refresh ASCEND dependency lockfile
on:
  push:
    branches:
      - feature/guided-learning-and-certificate-sync
    paths:
      - package.json
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock PostgreSQL dependencies"
            git push origin HEAD:feature/guided-learning-and-certificate-sync
          fi
